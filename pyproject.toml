[project]
name = "llm-wiki-tools"
version = "0.1.0"
description = "LLM 위키 레시피 노드가 부르는 결정론 도구 MCP 서버(수집·묶기·합치기·인덱스·위키 반영·검색)"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7,<1",
    "mcp>=1.2,<2",
    "pypdf>=4,<7",
]

[project.scripts]
llm-wiki-tools = "llm_wiki_tools.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_wiki_tools"]
